name: Nightly Fork

on:
    workflow_dispatch:
    workflow_run:
        workflows: [Tests]
        types: [completed]
        branches: [main]

permissions:
    contents: read

jobs:
    gate:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            eligible: ${{ steps.gate.outputs.eligible }}
            sha: ${{ steps.gate.outputs.sha }}
            tested_sha: ${{ steps.gate.outputs.tested_sha }}
            tests_run_id: ${{ steps.gate.outputs.tests_run_id }}
            tests_attempt: ${{ steps.gate.outputs.tests_attempt }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.workflow_sha }}
                  persist-credentials: false
            - name: Check successful Tests run and current main
              id: gate
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/fork-release.mjs gate

    build:
        needs: gate
        if: needs.gate.outputs.eligible == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      arch: x64
                    - runner: macos-latest
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        env:
            TARGET_SHA: ${{ needs.gate.outputs.sha }}
            TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
            TESTS_RUN_ID: ${{ needs.gate.outputs.tests_run_id }}
            TESTS_ATTEMPT: ${{ needs.gate.outputs.tests_attempt }}
        steps:
            - name: Checkout release controller
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.workflow_sha }}
                  persist-credentials: false
                  path: controller
            - name: Checkout target source
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
                  path: source
            - name: Recheck current main before preparation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node controller/.github/scripts/fork-release.mjs current-main
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: source/pnpm-lock.yaml
            - name: Restore verified pkg runtime cache
              id: pkg-cache
              uses: actions/cache/restore@v6
              with:
                  path: ~/.pkg-cache/**/fetched-*
                  key: fork-cli-runtime-v2-${{ runner.os }}-${{ matrix.arch }}-windows-macos-linuxstatic-alpine-${{ hashFiles('source/pnpm-lock.yaml', 'source/modules/build.ts') }}
            - name: Install and prepare CLI once
              working-directory: source
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run prebuild-cli
            - name: Build four CLI archives
              working-directory: source/lib
              env:
                  BUILD_ARCH: ${{ matrix.arch }}
              run: |
                  node modules/build "windows-$BUILD_ARCH"
                  node modules/build "macos-$BUILD_ARCH"
                  node modules/build "linuxstatic-$BUILD_ARCH"
                  node modules/build "alpine-$BUILD_ARCH"
            - name: Validate and record bundle
              env:
                  BUILD_ARCH: ${{ matrix.arch }}
              run: node controller/.github/scripts/fork-release.mjs record source/lib/_builds "bundle/$BUILD_ARCH" "$BUILD_ARCH"
            - name: Save verified pkg runtime cache
              if: steps.pkg-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ~/.pkg-cache/**/fetched-*
                  key: ${{ steps.pkg-cache.outputs.cache-primary-key }}
            - uses: actions/upload-artifact@v4
              with:
                  name: fork-cli-${{ matrix.arch }}
                  path: bundle/${{ matrix.arch }}/
                  if-no-files-found: error
                  overwrite: true
                  compression-level: 0

    publish:
        needs: [gate, build]
        if: needs.gate.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            actions: read
        concurrency:
            group: nightly-fork-publish
            queue: max
            cancel-in-progress: false
        env:
            GH_TOKEN: ${{ github.token }}
            TARGET_SHA: ${{ needs.gate.outputs.sha }}
            TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
            TESTS_RUN_ID: ${{ needs.gate.outputs.tests_run_id }}
            TESTS_ATTEMPT: ${{ needs.gate.outputs.tests_attempt }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.workflow_sha }}
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: fork-cli-x64
                  path: artifacts/x64
            - uses: actions/download-artifact@v4
              with:
                  name: fork-cli-arm64
                  path: artifacts/arm64
            - name: Verify bundles and publish rolling release
              run: node .github/scripts/fork-release.mjs publish artifacts

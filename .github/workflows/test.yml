name: Tests

on:
    push:
        branches: [develop, main]
        paths-ignore: ['**/*.md', 'docs/**', 'tools/**']
    pull_request:
        branches: [develop, main]
        paths-ignore: ['**/*.md', 'docs/**', 'tools/**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tsc:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
                  check-latest: true
            - run: pnpm install --frozen-lockfile
            - name: Check TypeScript
              run: pnpm exec tsc --noEmit
            - name: Run tracked source tests
              run: |
                  set -euo pipefail
                  git ls-files -z -- 'tests/*.mjs' | while IFS= read -r -d '' test_file; do
                      node "$test_file"
                  done
            - name: Verify generated CLI reference
              run: |
                  pnpm run docs
                  git diff --exit-code -- docs/DOCUMENTATION.md
    eslint:
        needs: tsc
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
                  check-latest: true
            - run: pnpm install --frozen-lockfile
            - run: pnpm run eslint
    prettier:
        needs: tsc
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
                  check-latest: true
            - run: pnpm install --frozen-lockfile
            - run: pnpm run prettier
    node22:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
                  check-latest: true
            - run: pnpm install --frozen-lockfile
            - name: Run tracked source tests
              run: |
                  set -euo pipefail
                  git ls-files -z -- 'tests/*.mjs' | while IFS= read -r -d '' test_file; do
                      node "$test_file"
                  done

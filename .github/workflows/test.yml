name: Style and build test

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tsc:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  check-latest: true
            - run: pnpm i
            - name: Check TypeScript
              run: pnpm exec tsc --noEmit
            - name: Test Crunchyroll token input
              run: node tests/crunchy-token-input.mjs
    eslint:
        needs: tsc
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  check-latest: true
            - run: pnpm i
            - run: pnpm run eslint
    prettier:
        needs: tsc
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  check-latest: true
            - run: pnpm i
            - run: pnpm run prettier
    build-test-windows-arm64:
        needs: [eslint, prettier, tsc]
        runs-on: windows-11-arm
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  check-latest: true
            - run: pnpm i
            - run: pnpm run test-windows-arm64
    build-test-linux-arm64:
        needs: [eslint, prettier, tsc]
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  check-latest: true
